[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kuramoto-dash-app"
version = "0.1.0"
description = "Interactive web dashboard for simulating and visualizing Kuramoto oscillator dynamics on complex networks"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "eigenscribe" }
]
dependencies = [
    "black>=26.5.1",
    "dash>=4.4.1",
    "kuramoto-benchmark-suite",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "ruff>=0.16.8",
    "scipy>=1.18.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["assets*", "notebooks*", "docs*", "tests*"]

# kuramoto-benchmark-suite is now installed from PyPI: pip install kuramoto-benchmark-suite
# Remove this section if you need to switch back to local development:
# [tool.uv.sources]
# kuramoto-benchmark-suite = { path = "../kuramoto-benchmark-suite", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "services.py", "integration.py"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | \.scriber-core
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    ".scriber-core",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in init files
